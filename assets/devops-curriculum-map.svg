<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030a12" />
      <stop offset="50%" stop-color="#061320" />
      <stop offset="100%" stop-color="#02060b" />
    </linearGradient>

    <pattern id="gridNet" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#0e2333" stroke-width="0.75" />
      <circle cx="28" cy="0" r="1" fill="#1e3a4e" />
    </pattern>

    <filter id="glowMap" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 8px #00FF9D); }
    }
    @keyframes lineFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    .flow-line {
      stroke-dasharray: 8 10;
      animation: lineFlow 3.5s linear infinite;
    }
    .node-pulse {
      transform-origin: center;
      animation: pulseDot 3s ease-in-out infinite;
    }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="700" rx="18" fill="url(#mapBg)" stroke="#163347" stroke-width="2" />
  <rect width="1200" height="700" fill="url(#gridNet)" opacity="0.7" />

  <!-- Top Title -->
  <g transform="translate(45, 40)">
    <text x="0" y="0" fill="#00FF9D" class="mono" font-size="13" font-weight="800" letter-spacing="2">05 // TAXONOMIC CURRICULUM ARCHITECTURE</text>
    <text x="0" y="28" fill="#F8FAFC" class="sans" font-size="22" font-weight="900">12-Track Enterprise DevOps Mastery Learning Pathway</text>
    <text x="0" y="52" fill="#94A3B8" class="sans" font-size="14">Progressive progression from Linux kernel primitives to multi-cloud Platform Engineering, SRE &amp; FinOps</text>
  </g>

  <!-- BACKGROUND INTERCONNECTING BUS LINES -->
  <g stroke="#1e3a4e" stroke-width="3" fill="none">
    <path d="M 235 155 L 320 155" />
    <path d="M 505 155 L 590 155" />
    <path d="M 775 155 L 860 155" />
    <path d="M 1045 155 L 1095 155 L 1095 295 L 1045 295" />
    
    <path d="M 860 295 L 775 295" />
    <path d="M 590 295 L 505 295" />
    <path d="M 320 295 L 235 295" />
    <path d="M 145 295 L 95 295 L 95 435 L 145 435" />

    <path d="M 320 435 L 405 435" />
    <path d="M 590 435 L 675 435" />
    <path d="M 860 435 L 945 435" />
  </g>

  <!-- ANIMATED FLOW PULSE LINES -->
  <g stroke="#00FF9D" stroke-width="2.5" fill="none" class="flow-line">
    <path d="M 235 155 L 320 155" />
    <path d="M 505 155 L 590 155" />
    <path d="M 775 155 L 860 155" />
    <path d="M 1045 155 L 1095 155 L 1095 295 L 1045 295" stroke="#06B6D4" />
    <path d="M 860 295 L 775 295" stroke="#06B6D4" />
    <path d="M 590 295 L 505 295" stroke="#3B82F6" />
    <path d="M 320 295 L 235 295" stroke="#3B82F6" />
    <path d="M 145 295 L 95 295 L 95 435 L 145 435" stroke="#8B5CF6" />
    <path d="M 320 435 L 405 435" stroke="#8B5CF6" />
    <path d="M 590 435 L 675 435" stroke="#EC4899" />
    <path d="M 860 435 L 945 435" stroke="#F59E0B" />
  </g>

  <!-- ================= 12 TRACK NODES ================= -->

  <!-- TIER 1: FOUNDATIONS (Top Row) -->
  <!-- TRACK 00 -->
  <g transform="translate(50, 110)">
    <rect width="185" height="92" rx="12" fill="#071b28" stroke="#00FF9D" stroke-width="1.8" />
    <circle cx="18" cy="20" r="5.5" fill="#00FF9D" class="node-pulse" />
    <text x="32" y="24" fill="#00FF9D" class="mono" font-size="11" font-weight="800">TRACK 00 // CORE</text>
    <text x="16" y="48" fill="#FFFFFF" class="sans" font-size="14" font-weight="900">Linux &amp; Shell Int.</text>
    <text x="16" y="66" fill="#A7F3D0" class="mono" font-size="10.5" font-weight="600">Namespaces • cgroups</text>
    <text x="16" y="80" fill="#CBD5E1" class="mono" font-size="10">Signals • Strict Bash</text>
  </g>

  <!-- TRACK 01 -->
  <g transform="translate(320, 110)">
    <rect width="185" height="92" rx="12" fill="#071b28" stroke="#00FF9D" stroke-width="1.8" />
    <circle cx="18" cy="20" r="5.5" fill="#00FF9D" />
    <text x="32" y="24" fill="#00FF9D" class="mono" font-size="11" font-weight="800">TRACK 01 // RUNTIMES</text>
    <text x="16" y="48" fill="#FFFFFF" class="sans" font-size="14" font-weight="900">OCI Containers</text>
    <text x="16" y="66" fill="#A7F3D0" class="mono" font-size="10.5" font-weight="600">Multi-Stage • BuildKit</text>
    <text x="16" y="80" fill="#CBD5E1" class="mono" font-size="10">Distroless • Non-Root</text>
  </g>

  <!-- TRACK 02 -->
  <g transform="translate(590, 110)">
    <rect width="185" height="92" rx="12" fill="#071b28" stroke="#06B6D4" stroke-width="1.8" />
    <circle cx="18" cy="20" r="5.5" fill="#06B6D4" />
    <text x="32" y="24" fill="#06B6D4" class="mono" font-size="11" font-weight="800">TRACK 02 // IAC</text>
    <text x="16" y="48" fill="#FFFFFF" class="sans" font-size="14" font-weight="900">Terraform &amp; IaC</text>
    <text x="16" y="66" fill="#7DD3FC" class="mono" font-size="10.5" font-weight="600">OpenTofu • State Lock</text>
    <text x="16" y="80" fill="#CBD5E1" class="mono" font-size="10">Terragrunt • Ansible</text>
  </g>

  <!-- TRACK 03 -->
  <g transform="translate(860, 110)">
    <rect width="185" height="92" rx="12" fill="#071b28" stroke="#06B6D4" stroke-width="1.8" />
    <circle cx="18" cy="20" r="5.5" fill="#06B6D4" />
    <text x="32" y="24" fill="#06B6D4" class="mono" font-size="11" font-weight="800">TRACK 03 // GITOPS</text>
    <text x="16" y="48" fill="#FFFFFF" class="sans" font-size="14" font-weight="900">CI/CD &amp; ArgoCD</text>
    <text x="16" y="66" fill="#7DD3FC" class="mono" font-size="10.5" font-weight="600">GitHub OIDC • Buildx</text>
    <text x="16" y="80" fill="#CBD5E1" class="mono" font-size="10">Argo Rollouts • Canary</text>
  </g>

  <!-- TIER 2: ORCHESTRATION & PLATFORM (Row 2 - Right to Left) -->
  <!-- TRACK 04 -->
  <g transform="translate(860, 250)">
    <rect width="185" height="92" rx="12" fill="#071b28" stroke="#3B82F6" stroke-width="1.8" />
    <circle cx="18" cy="20" r="5.5" fill="#3B82F6" />
    <text x="32" y="24" fill="#3B82F6" class="mono" font-size="11" font-weight="800">TRACK 04 // K8S</text>
    <text x="16" y="48" fill="#FFFFFF" class="sans" font-size="14" font-weight="900">Kubernetes Core</text>
    <text x="16" y="66" fill="#93C5FD" class="mono" font-size="10.5" font-weight="600">Control Plane • etcd</text>
    <text x="16" y="80" fill="#CBD5E1" class="mono" font-size="10">Gateway API • PDBs</text>
  </g>

  <!-- TRACK 05 -->
  <g transform="translate(590, 250)">
    <rect width="185" height="92" rx="12" fill="#071b28" stroke="#3B82F6" stroke-width="1.8" />
    <circle cx="18" cy="20" r="5.5" fill="#3B82F6" />
    <text x="32" y="24" fill="#3B82F6" class="mono" font-size="11" font-weight="800">TRACK 05 // IDP</text>
    <text x="16" y="48" fill="#FFFFFF" class="sans" font-size="14" font-weight="900">Platform Eng.</text>
    <text x="16" y="66" fill="#93C5FD" class="mono" font-size="10.5" font-weight="600">Backstage Catalogs</text>
    <text x="16" y="80" fill="#CBD5E1" class="mono" font-size="10">vCluster Preview Envs</text>
  </g>

  <!-- TRACK 06 -->
  <g transform="translate(320, 250)">
    <rect width="185" height="92" rx="12" fill="#071b28" stroke="#8B5CF6" stroke-width="1.8" />
    <circle cx="18" cy="20" r="5.5" fill="#8B5CF6" />
    <text x="32" y="24" fill="#8B5CF6" class="mono" font-size="11" font-weight="800">TRACK 06 // MESH</text>
    <text x="16" y="48" fill="#FFFFFF" class="sans" font-size="14" font-weight="900">Mesh &amp; eBPF</text>
    <text x="16" y="66" fill="#DDD6FE" class="mono" font-size="10.5" font-weight="600">Cilium CNI • Wireguard</text>
    <text x="16" y="80" fill="#CBD5E1" class="mono" font-size="10">Istio Ambient • mTLS</text>
  </g>

  <!-- TRACK 07 -->
  <g transform="translate(50, 250)">
    <rect width="185" height="92" rx="12" fill="#071b28" stroke="#8B5CF6" stroke-width="1.8" />
    <circle cx="18" cy="20" r="5.5" fill="#8B5CF6" />
    <text x="32" y="24" fill="#8B5CF6" class="mono" font-size="11" font-weight="800">TRACK 07 // OTEL</text>
    <text x="16" y="48" fill="#FFFFFF" class="sans" font-size="14" font-weight="900">Observability</text>
    <text x="16" y="66" fill="#DDD6FE" class="mono" font-size="10.5" font-weight="600">OTel Collector • Tempo</text>
    <text x="16" y="80" fill="#CBD5E1" class="mono" font-size="10">Prometheus • Grafana</text>
  </g>

  <!-- TIER 3: SECURITY, SRE & GOVERNANCE (Row 3 - Left to Right) -->
  <!-- TRACK 08 -->
  <g transform="translate(50, 390)">
    <rect width="185" height="92" rx="12" fill="#140f29" stroke="#EC4899" stroke-width="1.8" />
    <circle cx="18" cy="20" r="5.5" fill="#EC4899" />
    <text x="32" y="24" fill="#EC4899" class="mono" font-size="11" font-weight="800">TRACK 08 // SEC</text>
    <text x="16" y="48" fill="#FFFFFF" class="sans" font-size="14" font-weight="900">DevSecOps</text>
    <text x="16" y="66" fill="#F472B6" class="mono" font-size="10.5" font-weight="600">Kyverno • OPA Gate</text>
    <text x="16" y="80" fill="#CBD5E1" class="mono" font-size="10">Syft SBOM • Cosign</text>
  </g>

  <!-- TRACK 09 -->
  <g transform="translate(320, 390)">
    <rect width="185" height="92" rx="12" fill="#140f29" stroke="#EC4899" stroke-width="1.8" />
    <circle cx="18" cy="20" r="5.5" fill="#EC4899" />
    <text x="32" y="24" fill="#EC4899" class="mono" font-size="11" font-weight="800">TRACK 09 // SRE</text>
    <text x="16" y="48" fill="#FFFFFF" class="sans" font-size="14" font-weight="900">SRE &amp; Error Budget</text>
    <text x="16" y="66" fill="#F472B6" class="mono" font-size="10.5" font-weight="600">Multi-Burn SLO Alerts</text>
    <text x="16" y="80" fill="#CBD5E1" class="mono" font-size="10">Blameless Post-Mortem</text>
  </g>

  <!-- TRACK 10 -->
  <g transform="translate(590, 390)">
    <rect width="185" height="92" rx="12" fill="#1b1207" stroke="#F59E0B" stroke-width="1.8" />
    <circle cx="18" cy="20" r="5.5" fill="#F59E0B" />
    <text x="32" y="24" fill="#F59E0B" class="mono" font-size="11" font-weight="800">TRACK 10 // CHAOS</text>
    <text x="16" y="48" fill="#FFFFFF" class="sans" font-size="14" font-weight="900">Chaos Engineering</text>
    <text x="16" y="66" fill="#FDE68A" class="mono" font-size="10.5" font-weight="600">Chaos Mesh • Litmus</text>
    <text x="16" y="80" fill="#CBD5E1" class="mono" font-size="10">Steady-State Asserts</text>
  </g>

  <!-- TRACK 11 -->
  <g transform="translate(860, 390)">
    <rect width="185" height="92" rx="12" fill="#1b1207" stroke="#F59E0B" stroke-width="1.8" />
    <circle cx="18" cy="20" r="5.5" fill="#F59E0B" />
    <text x="32" y="24" fill="#F59E0B" class="mono" font-size="11" font-weight="800">TRACK 11 // FINOPS</text>
    <text x="16" y="48" fill="#FFFFFF" class="sans" font-size="14" font-weight="900">Cloud FinOps</text>
    <text x="16" y="66" fill="#FDE68A" class="mono" font-size="10.5" font-weight="600">Infracost PR Gates</text>
    <text x="16" y="80" fill="#CBD5E1" class="mono" font-size="10">Kubecost • Karpenter</text>
  </g>

  <!-- BOTTOM SUMMARY BANNER -->
  <g transform="translate(50, 530)">
    <rect width="1100" height="110" rx="14" fill="#051522" stroke="#00FF9D" stroke-width="1.5" filter="url(#glowMap)" />
    <circle cx="38" cy="55" r="18" fill="#062533" stroke="#00FF9D" stroke-width="1.8" />
    <polygon points="38,44 47,59 29,59" fill="#00FF9D" />

    <text x="78" y="42" fill="#FFFFFF" class="sans" font-size="17" font-weight="900">COMPLETE PRODUCTION READINESS PIPELINE</text>
    <text x="78" y="64" fill="#6EE7B7" class="mono" font-size="12" font-weight="700">Zero-Trust Security • 99.999% SLA Resiliency • Cost-Optimized Cloud Architecture</text>
    <text x="78" y="88" fill="#94A3B8" class="sans" font-size="13">Every track contains verified, production-ready manifests, security policies, and executable automation recipes.</text>

    <g transform="translate(890, 40)">
      <rect width="180" height="32" rx="16" fill="#082b3d" stroke="#00FF9D" stroke-width="1.2" />
      <circle cx="18" cy="16" r="5" fill="#00FF9D" class="node-pulse" />
      <text x="34" y="21" fill="#00FF9D" class="mono" font-size="11" font-weight="800">ENTERPRISE CERTIFIED</text>
    </g>
  </g>
</svg>