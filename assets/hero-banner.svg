<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#05131e" />
      <stop offset="80%" stop-color="#061f2d" />
      <stop offset="100%" stop-color="#020811" />
    </linearGradient>

    <linearGradient id="emeraldCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2538" />
      <stop offset="100%" stop-color="#051522" />
    </linearGradient>

    <radialGradient id="emeraldRadial" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanRadial" cx="80%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#132a3e" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="32" cy="0" r="1.5" fill="#10B981" fill-opacity="0.4"/>
    </pattern>

    <filter id="glow-emerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes dashCycle {
      to { stroke-dashoffset: -400; }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 12px #00FF9D); }
    }
    .circuit-line {
      stroke-dasharray: 10 16;
      animation: dashCycle 14s linear infinite;
    }
    .circuit-fast {
      stroke-dasharray: 12 20;
      animation: dashCycle 8s linear infinite;
    }
    .pulsing-node {
      transform-origin: center;
      animation: pulseOrb 3.5s ease-in-out infinite;
    }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="480" fill="url(#bgDark)" />
  <rect width="1200" height="480" fill="url(#techGrid)" />
  <rect width="1200" height="480" fill="url(#emeraldRadial)" />
  <rect width="1200" height="480" fill="url(#cyanRadial)" />

  <!-- Outer Cyber Border -->
  <rect x="14" y="14" width="1172" height="452" rx="18" fill="none" stroke="#1e3a4e" stroke-width="2" />
  <rect x="18" y="18" width="1164" height="444" rx="14" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 14 60 L 14 14 L 60 14" fill="none" stroke="#00FF9D" stroke-width="3.5" />
  <path d="M 1186 60 L 1186 14 L 1140 14" fill="none" stroke="#06b6d4" stroke-width="3.5" />
  <path d="M 14 420 L 14 466 L 60 466" fill="none" stroke="#06b6d4" stroke-width="3.5" />
  <path d="M 1186 420 L 1186 466 L 1140 466" fill="none" stroke="#00FF9D" stroke-width="3.5" />

  <!-- Top Status Radar Bar -->
  <g transform="translate(45, 42)">
    <rect x="0" y="0" width="340" height="30" rx="15" fill="#081b28" stroke="#1e3a4e" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5.5" fill="#00FF9D" class="pulsing-node" />
    <text x="32" y="20" fill="#a7f3d0" class="font-mono" font-size="12" font-weight="700" letter-spacing="1.2">SYSTEM // DEVOPS.VAULT.V3</text>
  </g>

  <g transform="translate(830, 42)">
    <rect x="0" y="0" width="325" height="30" rx="15" fill="#081b28" stroke="#1e3a4e" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#06B6D4" />
    <text x="30" y="20" fill="#cbd5e1" class="font-mono" font-size="12" font-weight="600">UPTIME: <tspan fill="#00FF9D" font-weight="800">99.999%</tspan> | SLA: <tspan fill="#38BDF8" font-weight="800">TIER-4</tspan></text>
  </g>

  <!-- Left Side: DevOps Continuous Pipeline Circuit -->
  <g opacity="0.8">
    <path d="M 50 200 C 130 150, 160 280, 240 230" fill="none" stroke="#10b981" stroke-width="2.5" class="circuit-line" />
    <path d="M 50 290 C 120 340, 180 220, 240 280" fill="none" stroke="#06b6d4" stroke-width="2" class="circuit-fast" />
    <circle cx="50" cy="200" r="6" fill="#00FF9D" filter="url(#glow-emerald)" />
    <circle cx="150" cy="215" r="5" fill="#06b6d4" />
    <circle cx="240" cy="230" r="6" fill="#38bdf8" filter="url(#glow-emerald)" />
    <circle cx="50" cy="290" r="5" fill="#f59e0b" />
    <circle cx="240" cy="280" r="5" fill="#10b981" />
  </g>

  <!-- Right Side: Mesh Circuit -->
  <g opacity="0.8" transform="translate(910, 0)">
    <path d="M 50 230 C 120 170, 170 300, 240 220" fill="none" stroke="#06b6d4" stroke-width="2.5" class="circuit-line" />
    <path d="M 40 310 C 110 250, 160 360, 240 300" fill="none" stroke="#8b5cf6" stroke-width="2" class="circuit-fast" />
    <circle cx="50" cy="230" r="6" fill="#06b6d4" filter="url(#glow-emerald)" />
    <circle cx="150" cy="235" r="5" fill="#818cf8" />
    <circle cx="240" cy="220" r="6" fill="#00FF9D" filter="url(#glow-emerald)" />
    <circle cx="40" cy="310" r="5" fill="#38bdf8" />
    <circle cx="240" cy="300" r="5" fill="#f59e0b" />
  </g>

  <!-- CENTER HERO CONTENT -->
  <g transform="translate(600, 110)">
    <rect x="-210" y="0" width="420" height="32" rx="16" fill="#06212e" stroke="#00FF9D" stroke-width="1.5" filter="url(#glow-emerald)" />
    <circle cx="-185" cy="16" r="5" fill="#00FF9D" class="pulsing-node" />
    <text x="0" y="21" fill="#00FF9D" class="font-mono" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="2.5">
      ENTERPRISE PLATFORM &amp; SRE ENGINE
    </text>
  </g>

  <!-- Main Title (Large, bold, crisp on all screen sizes) -->
  <text x="600" y="200" fill="url(#emeraldCyanGrad)" class="font-sans" font-size="48" font-weight="900" text-anchor="middle" letter-spacing="0.5">
    DEV-OPS KNOWLEDGE VAULT
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="238" fill="#F1F5F9" class="font-mono" font-size="16.5" font-weight="700" text-anchor="middle" letter-spacing="0.8">
    Production-Grade Architecture // Zero-Trust DevSecOps // GitOps &amp; Cloud Native
  </text>

  <!-- 4 Core Pillars Strip (Large touch-friendly mobile readable pills) -->
  <g transform="translate(110, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="230" height="60" rx="12" fill="url(#pillGrad)" stroke="#10b981" stroke-width="1.5" />
      <circle cx="24" cy="30" r="7" fill="#00FF9D" />
      <text x="44" y="27" fill="#FFFFFF" class="font-sans" font-size="15" font-weight="800">Platform Eng.</text>
      <text x="44" y="47" fill="#6EE7B7" class="font-mono" font-size="11.5" font-weight="600">K8s • IDP • Backstage</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(250, 0)">
      <rect width="230" height="60" rx="12" fill="url(#pillGrad)" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="24" cy="30" r="7" fill="#06B6D4" />
      <text x="44" y="27" fill="#FFFFFF" class="font-sans" font-size="15" font-weight="800">GitOps &amp; IaC</text>
      <text x="44" y="47" fill="#7DD3FC" class="font-mono" font-size="11.5" font-weight="600">Terraform • ArgoCD</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(500, 0)">
      <rect width="230" height="60" rx="12" fill="url(#pillGrad)" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="24" cy="30" r="7" fill="#F59E0B" />
      <text x="44" y="27" fill="#FFFFFF" class="font-sans" font-size="15" font-weight="800">Observability</text>
      <text x="44" y="47" fill="#FDE68A" class="font-mono" font-size="11.5" font-weight="600">OTel • Prometheus • SLO</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(750, 0)">
      <rect width="230" height="60" rx="12" fill="url(#pillGrad)" stroke="#8b5cf6" stroke-width="1.5" />
      <circle cx="24" cy="30" r="7" fill="#8B5CF6" />
      <text x="44" y="27" fill="#FFFFFF" class="font-sans" font-size="15" font-weight="800">DevSecOps</text>
      <text x="44" y="47" fill="#DDD6FE" class="font-mono" font-size="11.5" font-weight="600">Kyverno • Cilium • SBOM</text>
    </g>
  </g>

  <!-- Bottom Command Matrix -->
  <g transform="translate(600, 385)">
    <rect x="-420" y="0" width="840" height="46" rx="10" fill="#040e17" stroke="#1b364b" stroke-width="1.5" />
    <text x="-395" y="29" fill="#00FF9D" class="font-mono" font-size="16" font-weight="800">$</text>
    <text x="-370" y="29" fill="#38BDF8" class="font-mono" font-size="14.5" font-weight="700">devops.bootstrap</text>
    <text x="-205" y="29" fill="#94A3B8" class="font-mono" font-size="14">--track <tspan fill="#F59E0B" font-weight="700">"00-Foundations-to-11-FinOps"</tspan> --mode <tspan fill="#00FF9D" font-weight="700">"Production"</tspan></text>
  </g>
</svg>