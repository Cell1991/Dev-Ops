<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#05131e" />
      <stop offset="80%" stop-color="#061f2d" />
      <stop offset="100%" stop-color="#020811" />
    </linearGradient>

    <linearGradient id="emeraldCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="amberGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <radialGradient id="emeraldRadial" cx="15%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanRadial" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoRadial" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132a3e" stroke-width="0.75" stroke-opacity="0.5"/>
      <circle cx="30" cy="0" r="1.2" fill="#10B981" fill-opacity="0.35"/>
    </pattern>

    <!-- Filters for Glow Effect -->
    <filter id="glow-emerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes dashCycle {
      to {
        stroke-dashoffset: -400;
      }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 10px #10B981); }
    }
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { transform: translateY(440px); opacity: 0.1; }
    }
    @keyframes textGlow {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(16, 185, 129, 0.4)); }
      50% { filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.8)); }
    }

    .circuit-line {
      stroke-dasharray: 8 16;
      animation: dashCycle 15s linear infinite;
    }
    .circuit-fast {
      stroke-dasharray: 12 24;
      animation: dashCycle 8s linear infinite;
    }
    .pulsing-node {
      transform-origin: center;
      animation: pulseOrb 3.5s ease-in-out infinite;
    }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="440" fill="url(#bgDark)" />
  <rect width="1200" height="440" fill="url(#techGrid)" />
  <rect width="1200" height="440" fill="url(#emeraldRadial)" />
  <rect width="1200" height="440" fill="url(#cyanRadial)" />
  <rect width="1200" height="440" fill="url(#indigoRadial)" />

  <!-- Outer Cyber Bezel -->
  <rect x="16" y="16" width="1168" height="408" rx="16" fill="none" stroke="#1e3a4e" stroke-width="1.5" />
  <rect x="20" y="20" width="1160" height="400" rx="13" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="1" />

  <!-- Corner Brackets (DevOps Industrial Tech Style) -->
  <path d="M 16 55 L 16 16 L 55 16" fill="none" stroke="#10b981" stroke-width="3" />
  <path d="M 1184 55 L 1184 16 L 1145 16" fill="none" stroke="#06b6d4" stroke-width="3" />
  <path d="M 16 385 L 16 424 L 55 424" fill="none" stroke="#06b6d4" stroke-width="3" />
  <path d="M 1184 385 L 1184 424 L 1145 424" fill="none" stroke="#10b981" stroke-width="3" />

  <!-- Top Status Radar Bar -->
  <g transform="translate(45, 42)">
    <rect x="0" y="0" width="310" height="24" rx="12" fill="#081b28" stroke="#1e3a4e" stroke-width="1" />
    <circle cx="14" cy="12" r="5" fill="#10B981" class="pulsing-node" />
    <text x="26" y="16" fill="#a7f3d0" class="font-mono" font-size="10.5" font-weight="600" letter-spacing="1.2">SYSTEM // DEVOPS.COMPENDIUM.V3</text>
    
    <rect x="320" y="0" width="150" height="24" rx="12" fill="#081b28" stroke="#1e3a4e" stroke-width="1" />
    <circle cx="332" cy="12" r="4" fill="#06B6D4" />
    <text x="344" y="16" fill="#7dd3fc" class="font-mono" font-size="10" font-weight="600">CLUSTER: ACTIVE</text>
  </g>

  <g transform="translate(860, 42)">
    <rect x="0" y="0" width="295" height="24" rx="12" fill="#081b28" stroke="#1e3a4e" stroke-width="1" />
    <text x="14" y="16" fill="#cbd5e1" class="font-mono" font-size="10.5" font-weight="500">UPTIME: <tspan fill="#10B981" font-weight="700">99.999%</tspan> | SLA: <tspan fill="#06B6D4" font-weight="700">TIER-4</tspan></text>
  </g>

  <!-- Left Side: DevOps Continuous Pipeline Circuit -->
  <g opacity="0.75">
    <!-- Pipeline Spine Lines -->
    <path d="M 60 180 C 130 140, 160 260, 240 220" fill="none" stroke="#10b981" stroke-width="2" class="circuit-line" />
    <path d="M 60 260 C 120 310, 180 200, 240 260" fill="none" stroke="#06b6d4" stroke-width="1.8" class="circuit-fast" />
    
    <!-- Nodes -->
    <circle cx="60" cy="180" r="5" fill="#10b981" filter="url(#glow-emerald)" />
    <circle cx="150" cy="200" r="4" fill="#06b6d4" />
    <circle cx="240" cy="220" r="5.5" fill="#38bdf8" filter="url(#glow-emerald)" />
    <circle cx="60" cy="260" r="4" fill="#f59e0b" />
    <circle cx="240" cy="260" r="4" fill="#10b981" />

    <!-- Mini Telemetry Tags -->
    <text x="68" y="174" fill="#6ee7b7" class="font-mono" font-size="9">PLAN &amp; CODE</text>
    <text x="68" y="275" fill="#fcd34d" class="font-mono" font-size="9">BUILD &amp; TEST</text>
    <text x="210" y="208" fill="#7dd3fc" class="font-mono" font-size="9">DEPLOY</text>
  </g>

  <!-- Right Side: Microservices Cluster & Mesh Circuit -->
  <g opacity="0.75" transform="translate(900, 0)">
    <path d="M 60 210 C 120 160, 170 270, 230 200" fill="none" stroke="#06b6d4" stroke-width="2" class="circuit-line" />
    <path d="M 50 280 C 110 230, 160 330, 230 280" fill="none" stroke="#6366f1" stroke-width="1.8" class="circuit-fast" />
    
    <polygon points="60,210 70,225 50,225" fill="#06b6d4" filter="url(#glow-emerald)" />
    <circle cx="145" cy="215" r="4.5" fill="#818cf8" />
    <circle cx="230" cy="200" r="5.5" fill="#10b981" filter="url(#glow-emerald)" />
    <circle cx="50" cy="280" r="4" fill="#38bdf8" />
    <circle cx="230" cy="280" r="4.5" fill="#f59e0b" />

    <text x="45" y="198" fill="#7dd3fc" class="font-mono" font-size="9">OBSERVE</text>
    <text x="180" y="190" fill="#6ee7b7" class="font-mono" font-size="9">RESONATE</text>
    <text x="195" y="298" fill="#fcd34d" class="font-mono" font-size="9">SECURE</text>
  </g>

  <!-- CENTER HERO CONTENT -->
  <!-- Floating DevOps Badge -->
  <g transform="translate(600, 108)">
    <rect x="-185" y="0" width="370" height="28" rx="14" fill="#06212e" stroke="#10b981" stroke-width="1.2" filter="url(#glow-emerald)" />
    <circle cx="-165" cy="14" r="4.5" fill="#00FF9D" class="pulsing-node" />
    <text x="0" y="18" fill="#00FF9D" class="font-mono" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="2.5">
      ENTERPRISE PLATFORM &amp; SRE ENGINE
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="192" fill="url(#emeraldCyanGrad)" class="font-sans" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-0.5" style="animation: textGlow 5s ease-in-out infinite;">
    DEV-OPS KNOWLEDGE VAULT
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="228" fill="#E2E8F0" class="font-mono" font-size="15.5" font-weight="600" text-anchor="middle" letter-spacing="1">
    Production-Grade Architecture // Zero-Trust DevSecOps // GitOps &amp; Cloud Native
  </text>

  <!-- Pillars Indicator Strip -->
  <g transform="translate(200, 260)">
    <!-- 4 Core Pillars Pills -->
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="42" rx="10" fill="#091b29" stroke="#1e3a4e" stroke-width="1" />
      <circle cx="20" cy="21" r="5" fill="#10B981" />
      <text x="36" y="19" fill="#F1F5F9" class="font-sans" font-size="12" font-weight="700">Platform Eng.</text>
      <text x="36" y="32" fill="#94A3B8" class="font-mono" font-size="9">K8s • IDP • Backstage</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(205, 0)">
      <rect x="0" y="0" width="185" height="42" rx="10" fill="#091b29" stroke="#1e3a4e" stroke-width="1" />
      <circle cx="20" cy="21" r="5" fill="#06B6D4" />
      <text x="36" y="19" fill="#F1F5F9" class="font-sans" font-size="12" font-weight="700">GitOps &amp; IaC</text>
      <text x="36" y="32" fill="#94A3B8" class="font-mono" font-size="9">Terraform • ArgoCD • OCI</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(415, 0)">
      <rect x="0" y="0" width="185" height="42" rx="10" fill="#091b29" stroke="#1e3a4e" stroke-width="1" />
      <circle cx="20" cy="21" r="5" fill="#F59E0B" />
      <text x="36" y="19" fill="#F1F5F9" class="font-sans" font-size="12" font-weight="700">Observability &amp; SRE</text>
      <text x="36" y="32" fill="#94A3B8" class="font-mono" font-size="9">OTel • Prometheus • SLO</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(625, 0)">
      <rect x="0" y="0" width="175" height="42" rx="10" fill="#091b29" stroke="#1e3a4e" stroke-width="1" />
      <circle cx="20" cy="21" r="5" fill="#8B5CF6" />
      <text x="36" y="19" fill="#F1F5F9" class="font-sans" font-size="12" font-weight="700">DevSecOps &amp; eBPF</text>
      <text x="36" y="32" fill="#94A3B8" class="font-mono" font-size="9">Kyverno • Cilium • SBOM</text>
    </g>
  </g>

  <!-- Bottom Command Matrix -->
  <g transform="translate(600, 345)">
    <rect x="-370" y="0" width="740" height="38" rx="8" fill="#040e17" stroke="#132a3e" stroke-width="1" />
    <text x="-350" y="24" fill="#00FF9D" class="font-mono" font-size="13" font-weight="700">$</text>
    <text x="-330" y="24" fill="#38BDF8" class="font-mono" font-size="12.5" font-weight="600">devops.bootstrap</text>
    <text x="-185" y="24" fill="#94A3B8" class="font-mono" font-size="12.5">--track <tspan fill="#F59E0B">"00-Foundations-to-11-FinOps"</tspan> --mode <tspan fill="#10B981">"Production-Ready"</tspan></text>
  </g>

  <!-- Micro Footer Line -->
  <line x1="120" y1="405" x2="1080" y2="405" stroke="#132a3e" stroke-width="1" stroke-dasharray="4 8" />
</svg>
