<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05101a" />
      <stop offset="100%" stop-color="#020811" />
    </linearGradient>

    <linearGradient id="loopGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="25%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="75%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00FF9D" />
    </linearGradient>

    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="smallGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0f2636" stroke-width="0.75" />
    </pattern>
  </defs>

  <style>
    @keyframes loopFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -800; }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #00ff9d); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 18px #06b6d4); }
    }
    .flow-stream {
      stroke-dasharray: 14 20;
      animation: loopFlow 14s linear infinite;
    }
    .core-pulse {
      transform-origin: 600px 285px;
      animation: pulseCore 4s ease-in-out infinite;
    }
    .font-code { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-ui { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect width="1200" height="560" rx="18" fill="url(#cardBg)" stroke="#163347" stroke-width="2" />
  <rect width="1200" height="560" fill="url(#smallGrid)" opacity="0.6" />

  <!-- Top Title Banner -->
  <g transform="translate(45, 40)">
    <text x="0" y="0" fill="#00FF9D" class="font-code" font-size="13" font-weight="800" letter-spacing="2">01 // CONTINUOUS LIFECYCLE &amp; FEEDBACK LOOP</text>
    <text x="0" y="28" fill="#F8FAFC" class="font-ui" font-size="22" font-weight="900">The Modern Cloud-Native Delivery Loop</text>
    <text x="0" y="52" fill="#94A3B8" class="font-ui" font-size="14">Iterative, automated, and observable loop connecting Development, Operations, and Security</text>
  </g>

  <!-- Main Infinity Loop Track -->
  <path d="M 600 285 C 470 120, 200 120, 200 285 C 200 450, 470 450, 600 285 C 730 120, 1000 120, 1000 285 C 1000 450, 730 450, 600 285 Z"
        fill="none" stroke="#0e2a3c" stroke-width="32" stroke-linecap="round" />

  <path d="M 600 285 C 470 120, 200 120, 200 285 C 200 450, 470 450, 600 285 C 730 120, 1000 120, 1000 285 C 1000 450, 730 450, 600 285 Z"
        fill="none" stroke="url(#loopGradient)" stroke-width="8" class="flow-stream" stroke-linecap="round" filter="url(#nodeGlow)" />

  <!-- Center Hub: Continuous Integration & Delivery -->
  <g class="core-pulse">
    <circle cx="600" cy="285" r="38" fill="#061f2d" stroke="#00FF9D" stroke-width="2.5" />
    <circle cx="600" cy="285" r="20" fill="#00FF9D" opacity="0.3" />
    <text x="600" y="281" fill="#FFFFFF" class="font-code" font-size="12" font-weight="800" text-anchor="middle">CI / CD</text>
    <text x="600" y="297" fill="#00FF9D" class="font-code" font-size="10.5" font-weight="800" text-anchor="middle">GITOPS</text>
  </g>

  <!-- STAGE NODES & BADGES (Enlarged for Mobile Legibility) -->

  <!-- STAGE 1: PLAN -->
  <g transform="translate(340, 150)">
    <rect x="-80" y="-26" width="160" height="52" rx="12" fill="#071b26" stroke="#00FF9D" stroke-width="1.8" />
    <circle cx="-56" cy="0" r="7" fill="#00FF9D" />
    <text x="-42" y="-3" fill="#ffffff" class="font-ui" font-size="14" font-weight="800">01. PLAN</text>
    <text x="-42" y="14" fill="#6EE7B7" class="font-code" font-size="11" font-weight="600">Jira • Linear • ADR</text>
  </g>

  <!-- STAGE 2: CODE -->
  <g transform="translate(160, 285)">
    <rect x="-80" y="-26" width="160" height="52" rx="12" fill="#071b26" stroke="#06b6d4" stroke-width="1.8" />
    <circle cx="-56" cy="0" r="7" fill="#06b6d4" />
    <text x="-42" y="-3" fill="#ffffff" class="font-ui" font-size="14" font-weight="800">02. CODE</text>
    <text x="-42" y="14" fill="#7DD3FC" class="font-code" font-size="11" font-weight="600">Git • Trunk • VSCode</text>
  </g>

  <!-- STAGE 3: BUILD -->
  <g transform="translate(340, 420)">
    <rect x="-80" y="-26" width="160" height="52" rx="12" fill="#071b26" stroke="#06b6d4" stroke-width="1.8" />
    <circle cx="-56" cy="0" r="7" fill="#06b6d4" />
    <text x="-42" y="-3" fill="#ffffff" class="font-ui" font-size="14" font-weight="800">03. BUILD</text>
    <text x="-42" y="14" fill="#7DD3FC" class="font-code" font-size="11" font-weight="600">Docker • Buildx • OCI</text>
  </g>

  <!-- STAGE 4: TEST & SCAN -->
  <g transform="translate(480, 345)">
    <rect x="-70" y="-22" width="140" height="44" rx="10" fill="#071b26" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="-48" cy="0" r="6" fill="#3b82f6" />
    <text x="-34" y="-2" fill="#ffffff" class="font-ui" font-size="13" font-weight="800">04. TEST</text>
    <text x="-34" y="13" fill="#93C5FD" class="font-code" font-size="10.5" font-weight="600">PyTest • Trivy</text>
  </g>

  <!-- STAGE 5: RELEASE -->
  <g transform="translate(720, 225)">
    <rect x="-70" y="-22" width="140" height="44" rx="10" fill="#071b26" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="-48" cy="0" r="6" fill="#3b82f6" />
    <text x="-34" y="-2" fill="#ffffff" class="font-ui" font-size="13" font-weight="800">05. RELEASE</text>
    <text x="-34" y="13" fill="#93C5FD" class="font-code" font-size="10.5" font-weight="600">Cosign • Helm</text>
  </g>

  <!-- STAGE 6: DEPLOY -->
  <g transform="translate(860, 150)">
    <rect x="-80" y="-26" width="160" height="52" rx="12" fill="#071b26" stroke="#8b5cf6" stroke-width="1.8" />
    <circle cx="-56" cy="0" r="7" fill="#8b5cf6" />
    <text x="-42" y="-3" fill="#ffffff" class="font-ui" font-size="14" font-weight="800">06. DEPLOY</text>
    <text x="-42" y="14" fill="#DDD6FE" class="font-code" font-size="11" font-weight="600">ArgoCD • Rollouts</text>
  </g>

  <!-- STAGE 7: OPERATE -->
  <g transform="translate(1040, 285)">
    <rect x="-80" y="-26" width="160" height="52" rx="12" fill="#071b26" stroke="#ec4899" stroke-width="1.8" />
    <circle cx="-56" cy="0" r="7" fill="#ec4899" />
    <text x="-42" y="-3" fill="#ffffff" class="font-ui" font-size="14" font-weight="800">07. OPERATE</text>
    <text x="-42" y="14" fill="#F472B6" class="font-code" font-size="11" font-weight="600">K8s • Istio • Cilium</text>
  </g>

  <!-- STAGE 8: MONITOR -->
  <g transform="translate(860, 420)">
    <rect x="-80" y="-26" width="160" height="52" rx="12" fill="#071b26" stroke="#f59e0b" stroke-width="1.8" />
    <circle cx="-56" cy="0" r="7" fill="#f59e0b" />
    <text x="-42" y="-3" fill="#ffffff" class="font-ui" font-size="14" font-weight="800">08. OBSERVE</text>
    <text x="-42" y="14" fill="#FDE68A" class="font-code" font-size="11" font-weight="600">OTel • Grafana • SLO</text>
  </g>

  <!-- Bottom Badges Strip -->
  <g transform="translate(45, 505)">
    <rect x="0" y="0" width="1110" height="34" rx="8" fill="#040c14" stroke="#132a3e" stroke-width="1" />
    <text x="24" y="22" fill="#00FF9D" class="font-code" font-size="12" font-weight="800">SHIFT-LEFT SECURITY:</text>
    <text x="210" y="22" fill="#94A3B8" class="font-code" font-size="12" font-weight="600">SAST • Secret Scanning • Policy-as-Code (Kyverno) • SBOM Attestation • Chaos Testing</text>
  </g>
</svg>