<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d16" />
      <stop offset="100%" stop-color="#02060b" />
    </linearGradient>

    <pattern id="pipeGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#132a3e" />
    </pattern>
  </defs>

  <style>
    @keyframes marchPipe {
      to { stroke-dashoffset: -120; }
    }
    .pipe-active {
      stroke-dasharray: 8 10;
      animation: marchPipe 3s linear infinite;
    }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Container -->
  <rect width="1200" height="520" rx="18" fill="url(#pipeBg)" stroke="#163347" stroke-width="2" />
  <rect width="1200" height="520" fill="url(#pipeGrid)" opacity="0.7" />

  <!-- Header -->
  <g transform="translate(45, 38)">
    <text x="0" y="0" fill="#00FF9D" class="font-mono" font-size="13" font-weight="800" letter-spacing="2">04 // ARCHITECTURAL PIPELINE</text>
    <text x="0" y="28" fill="#F8FAFC" class="font-sans" font-size="22" font-weight="900">End-to-End Enterprise GitOps &amp; Security Pipeline</text>
    <text x="0" y="52" fill="#94A3B8" class="font-sans" font-size="14">Cryptographically verifiable immutable supply chain from developer commit to Kubernetes cluster</text>
  </g>

  <!-- CONNECTING PIPE LINES -->
  <g stroke="#1e3a4e" stroke-width="3.5">
    <line x1="210" y1="185" x2="270" y2="185" />
    <line x1="450" y1="185" x2="510" y2="185" />
    <line x1="690" y1="185" x2="750" y2="185" />
    <line x1="930" y1="185" x2="990" y2="185" />
    <path d="M 1080 250 L 1080 365 L 1010 365" fill="none" />
    <line x1="750" y1="365" x2="690" y2="365" />
    <line x1="430" y1="365" x2="370" y2="365" />
    <path d="M 190 365 L 120 365 L 120 250" fill="none" />
  </g>

  <!-- ACTIVE ANIMATED DASH LINES -->
  <g stroke="#00FF9D" stroke-width="2.5" class="pipe-active">
    <line x1="210" y1="185" x2="270" y2="185" />
    <line x1="450" y1="185" x2="510" y2="185" />
    <line x1="690" y1="185" x2="750" y2="185" />
    <line x1="930" y1="185" x2="990" y2="185" />
    <path d="M 1080 250 L 1080 365 L 1010 365" fill="none" stroke="#06B6D4" />
    <line x1="750" y1="365" x2="690" y2="365" stroke="#06B6D4" />
    <line x1="430" y1="365" x2="370" y2="365" stroke="#F59E0B" />
    <path d="M 190 365 L 120 365 L 120 250" fill="none" stroke="#F59E0B" />
  </g>

  <!-- STEP 1: DEVELOPER WORKSPACE -->
  <g transform="translate(30, 115)">
    <rect width="180" height="135" rx="12" fill="#081e2c" stroke="#00FF9D" stroke-width="1.8" />
    <circle cx="24" cy="24" r="7" fill="#00FF9D" />
    <text x="38" y="29" fill="#FFFFFF" class="font-sans" font-size="14.5" font-weight="800">1. Developer</text>
    <text x="14" y="58" fill="#CBD5E1" class="font-mono" font-size="11.5">• Git Trunk Flow</text>
    <text x="14" y="78" fill="#CBD5E1" class="font-mono" font-size="11.5">• Gitleaks Hooks</text>
    <text x="14" y="98" fill="#CBD5E1" class="font-mono" font-size="11.5">• DevContainer</text>
    <rect x="14" y="108" width="152" height="18" rx="4" fill="#0c2e44" />
    <text x="20" y="121" fill="#00FF9D" class="font-mono" font-size="10" font-weight="700">git push origin main</text>
  </g>

  <!-- STEP 2: CI ORCHESTRATION -->
  <g transform="translate(270, 115)">
    <rect width="180" height="135" rx="12" fill="#081e2c" stroke="#06b6d4" stroke-width="1.8" />
    <circle cx="24" cy="24" r="7" fill="#06B6D4" />
    <text x="38" y="29" fill="#FFFFFF" class="font-sans" font-size="14.5" font-weight="800">2. GitHub CI</text>
    <text x="14" y="58" fill="#CBD5E1" class="font-mono" font-size="11.5">• Multi-stage Buildx</text>
    <text x="14" y="78" fill="#CBD5E1" class="font-mono" font-size="11.5">• Unit / Race Tests</text>
    <text x="14" y="98" fill="#CBD5E1" class="font-mono" font-size="11.5">• OIDC Keyless Auth</text>
    <rect x="14" y="108" width="152" height="18" rx="4" fill="#0c2e44" />
    <text x="20" y="121" fill="#7DD3FC" class="font-mono" font-size="10" font-weight="700">BUILD SUCCESS</text>
  </g>

  <!-- STEP 3: SECURITY SCAN & SIGN -->
  <g transform="translate(510, 115)">
    <rect width="180" height="135" rx="12" fill="#140f29" stroke="#8b5cf6" stroke-width="1.8" />
    <circle cx="24" cy="24" r="7" fill="#8B5CF6" />
    <text x="38" y="29" fill="#FFFFFF" class="font-sans" font-size="14.5" font-weight="800">3. Sec &amp; Attest</text>
    <text x="14" y="58" fill="#CBD5E1" class="font-mono" font-size="11.5">• Trivy / Grype CVE</text>
    <text x="14" y="78" fill="#CBD5E1" class="font-mono" font-size="11.5">• Syft SPDX SBOM</text>
    <text x="14" y="98" fill="#CBD5E1" class="font-mono" font-size="11.5">• Cosign Keyless</text>
    <rect x="14" y="108" width="152" height="18" rx="4" fill="#221742" />
    <text x="20" y="121" fill="#DDD6FE" class="font-mono" font-size="10" font-weight="700">SLSA L3 Attested</text>
  </g>

  <!-- STEP 4: OCI IMMUTABLE REGISTRY -->
  <g transform="translate(750, 115)">
    <rect width="180" height="135" rx="12" fill="#081e2c" stroke="#3b82f6" stroke-width="1.8" />
    <circle cx="24" cy="24" r="7" fill="#3B82F6" />
    <text x="38" y="29" fill="#FFFFFF" class="font-sans" font-size="14.5" font-weight="800">4. OCI Registry</text>
    <text x="14" y="58" fill="#CBD5E1" class="font-mono" font-size="11.5">• GitHub GHCR / ECR</text>
    <text x="14" y="78" fill="#CBD5E1" class="font-mono" font-size="11.5">• Helm OCI Charts</text>
    <text x="14" y="98" fill="#CBD5E1" class="font-mono" font-size="11.5">• Immutable SHA</text>
    <rect x="14" y="108" width="152" height="18" rx="4" fill="#0c2e44" />
    <text x="20" y="121" fill="#93C5FD" class="font-mono" font-size="10" font-weight="700">sha256:8f92a10b</text>
  </g>

  <!-- STEP 5: ARGOCD GITOPS RECONCILER -->
  <g transform="translate(990, 115)">
    <rect width="180" height="135" rx="12" fill="#081e2c" stroke="#ec4899" stroke-width="1.8" />
    <circle cx="24" cy="24" r="7" fill="#EC4899" />
    <text x="38" y="29" fill="#FFFFFF" class="font-sans" font-size="14.5" font-weight="800">5. ArgoCD Sync</text>
    <text x="14" y="58" fill="#CBD5E1" class="font-mono" font-size="11.5">• Git Source Truth</text>
    <text x="14" y="78" fill="#CBD5E1" class="font-mono" font-size="11.5">• Auto Self-Healing</text>
    <text x="14" y="98" fill="#CBD5E1" class="font-mono" font-size="11.5">• Kyverno Admission</text>
    <rect x="14" y="108" width="152" height="18" rx="4" fill="#2c0c1e" />
    <text x="20" y="121" fill="#F472B6" class="font-mono" font-size="10" font-weight="700">Synced &amp; Healthy</text>
  </g>

  <!-- STEP 6: KUBERNETES TARGET CLUSTER -->
  <g transform="translate(750, 300)">
    <rect width="260" height="130" rx="12" fill="#071824" stroke="#00FF9D" stroke-width="1.8" />
    <circle cx="24" cy="24" r="7" fill="#00FF9D" />
    <text x="38" y="29" fill="#FFFFFF" class="font-sans" font-size="14.5" font-weight="800">6. Kubernetes &amp; Mesh</text>
    <text x="14" y="58" fill="#CBD5E1" class="font-mono" font-size="11.5">• Restricted Pod Security</text>
    <text x="14" y="78" fill="#CBD5E1" class="font-mono" font-size="11.5">• Cilium eBPF L7 Policy</text>
    <text x="14" y="98" fill="#CBD5E1" class="font-mono" font-size="11.5">• Argo Rollouts Canary</text>
    <rect x="14" y="106" width="232" height="16" rx="4" fill="#0a2a3e" />
    <text x="20" y="118" fill="#6EE7B7" class="font-mono" font-size="9.5" font-weight="700">Canary: 10% -&gt; 50% -&gt; 100%</text>
  </g>

  <!-- STEP 7: OPENTELEMETRY & TELEMETRY -->
  <g transform="translate(430, 300)">
    <rect width="260" height="130" rx="12" fill="#1b1207" stroke="#f59e0b" stroke-width="1.8" />
    <circle cx="24" cy="24" r="7" fill="#F59E0B" />
    <text x="38" y="29" fill="#FFFFFF" class="font-sans" font-size="14.5" font-weight="800">7. Observability &amp; SRE</text>
    <text x="14" y="58" fill="#CBD5E1" class="font-mono" font-size="11.5">• OTel Collector Agent</text>
    <text x="14" y="78" fill="#CBD5E1" class="font-mono" font-size="11.5">• Multi-Burn Error SLOs</text>
    <text x="14" y="98" fill="#CBD5E1" class="font-mono" font-size="11.5">• Tempo Distributed Traces</text>
    <rect x="14" y="106" width="232" height="16" rx="4" fill="#2d1d07" />
    <text x="20" y="118" fill="#FDE68A" class="font-mono" font-size="9.5" font-weight="700">SLO: 99.99% Availability</text>
  </g>

  <!-- STEP 8: AUTO-HEALING & FEEDBACK -->
  <g transform="translate(190, 300)">
    <rect width="180" height="130" rx="12" fill="#081e2c" stroke="#06b6d4" stroke-width="1.8" />
    <circle cx="24" cy="24" r="7" fill="#06B6D4" />
    <text x="38" y="29" fill="#FFFFFF" class="font-sans" font-size="14.5" font-weight="800">8. Feedback Loop</text>
    <text x="14" y="58" fill="#CBD5E1" class="font-mono" font-size="11.5">• Auto Rollback on 5xx</text>
    <text x="14" y="78" fill="#CBD5E1" class="font-mono" font-size="11.5">• Infracost PR Cost</text>
    <text x="14" y="98" fill="#CBD5E1" class="font-mono" font-size="11.5">• PagerDuty Alerts</text>
    <rect x="14" y="106" width="152" height="16" rx="4" fill="#0c2e44" />
    <text x="20" y="118" fill="#7DD3FC" class="font-mono" font-size="9.5" font-weight="700">Self-Healing Armed</text>
  </g>

  <!-- BOTTOM ACCENT -->
  <g transform="translate(45, 475)">
    <text x="0" y="16" fill="#94A3B8" class="font-mono" font-size="12" font-weight="600">AUTOMATED DRIFT DETECTION: <tspan fill="#00FF9D" font-weight="800">ENABLED</tspan> | CONTINUOUS COMPLIANCE: <tspan fill="#38BDF8" font-weight="800">ACTIVE</tspan> | ZERO-TOUCH DEPLOY: <tspan fill="#F59E0B" font-weight="800">ENFORCED</tspan></text>
  </g>
</svg>