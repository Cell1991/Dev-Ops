<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d16" />
      <stop offset="100%" stop-color="#02060b" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <filter id="nodeGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="pipeGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#132a3e" />
    </pattern>
  </defs>

  <style>
    @keyframes marchPipe {
      to { stroke-dashoffset: -120; }
    }
    .pipe-active {
      stroke-dasharray: 6 8;
      animation: marchPipe 3s linear infinite;
    }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Container -->
  <rect width="1200" height="480" rx="16" fill="url(#pipeBg)" stroke="#163347" stroke-width="1.5" />
  <rect width="1200" height="480" fill="url(#pipeGrid)" opacity="0.7" />

  <!-- Header -->
  <g transform="translate(40, 34)">
    <text x="0" y="0" fill="#10B981" class="font-mono" font-size="12" font-weight="700" letter-spacing="2">04 // ARCHITECTURAL FLOW</text>
    <text x="0" y="24" fill="#F8FAFC" class="font-sans" font-size="20" font-weight="800">End-to-End Enterprise GitOps &amp; Security Pipeline</text>
    <text x="0" y="44" fill="#94A3B8" class="font-sans" font-size="12">Cryptographically verifiable immutable supply chain from developer commit to Kubernetes cluster</text>
  </g>

  <!-- CONNECTING PIPE LINES (Underneath Nodes) -->
  <g stroke="#1e3a4e" stroke-width="3">
    <!-- Dev -> CI -->
    <line x1="210" y1="180" x2="270" y2="180" />
    <!-- CI -> Security Gate -->
    <line x1="450" y1="180" x2="510" y2="180" />
    <!-- Security Gate -> OCI Registry -->
    <line x1="690" y1="180" x2="750" y2="180" />
    <!-- OCI Registry -> ArgoCD -->
    <line x1="930" y1="180" x2="990" y2="180" />
    <!-- ArgoCD -> Cluster -->
    <path d="M 1070 240 L 1070 340 L 1000 340" fill="none" />
    <!-- Cluster -> Telemetry -->
    <line x1="760" y1="340" x2="700" y2="340" />
    <!-- Telemetry -> Feedback Loop -->
    <line x1="460" y1="340" x2="400" y2="340" />
    <!-- Feedback back to Dev -->
    <path d="M 220 340 L 120 340 L 120 240" fill="none" />
  </g>

  <!-- ACTIVE ANIMATED DASH LINES -->
  <g stroke="#10B981" stroke-width="2" class="pipe-active">
    <line x1="210" y1="180" x2="270" y2="180" />
    <line x1="450" y1="180" x2="510" y2="180" />
    <line x1="690" y1="180" x2="750" y2="180" />
    <line x1="930" y1="180" x2="990" y2="180" />
    <path d="M 1070 240 L 1070 340 L 1000 340" fill="none" stroke="#06B6D4" />
    <line x1="760" y1="340" x2="700" y2="340" stroke="#06B6D4" />
    <line x1="460" y1="340" x2="400" y2="340" stroke="#F59E0B" />
    <path d="M 220 340 L 120 340 L 120 240" fill="none" stroke="#F59E0B" />
  </g>

  <!-- STEP 1: DEVELOPER WORKSPACE -->
  <g transform="translate(30, 120)">
    <rect width="180" height="120" rx="10" fill="#081e2c" stroke="#10b981" stroke-width="1.2" />
    <circle cx="24" cy="24" r="6" fill="#10B981" />
    <text x="36" y="28" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="700">1. Developer Work</text>
    <text x="14" y="54" fill="#94A3B8" class="font-mono" font-size="10">• Git Trunk Workflow</text>
    <text x="14" y="72" fill="#94A3B8" class="font-mono" font-size="10">• Pre-commit Hooks</text>
    <text x="14" y="90" fill="#94A3B8" class="font-mono" font-size="10">• Local Dev / DevContainer</text>
    <rect x="14" y="98" width="152" height="14" rx="3" fill="#0c2e44" />
    <text x="20" y="109" fill="#6EE7B7" class="font-mono" font-size="8.5">git push origin main</text>
  </g>

  <!-- STEP 2: CI ORCHESTRATION -->
  <g transform="translate(270, 120)">
    <rect width="180" height="120" rx="10" fill="#081e2c" stroke="#06b6d4" stroke-width="1.2" />
    <circle cx="24" cy="24" r="6" fill="#06B6D4" />
    <text x="36" y="28" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="700">2. GitHub Actions</text>
    <text x="14" y="54" fill="#94A3B8" class="font-mono" font-size="10">• Multi-stage Buildx</text>
    <text x="14" y="72" fill="#94A3B8" class="font-mono" font-size="10">• Automated Unit Tests</text>
    <text x="14" y="90" fill="#94A3B8" class="font-mono" font-size="10">• OIDC Cloud Auth</text>
    <rect x="14" y="98" width="152" height="14" rx="3" fill="#0c2e44" />
    <text x="20" y="109" fill="#7DD3FC" class="font-mono" font-size="8.5">BUILD SUCCESS (0s drift)</text>
  </g>

  <!-- STEP 3: SECURITY SCAN & SIGN -->
  <g transform="translate(510, 120)">
    <rect width="180" height="120" rx="10" fill="#140f29" stroke="#8b5cf6" stroke-width="1.2" />
    <circle cx="24" cy="24" r="6" fill="#8B5CF6" />
    <text x="36" y="28" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="700">3. Security &amp; Attest</text>
    <text x="14" y="54" fill="#94A3B8" class="font-mono" font-size="10">• Trivy / Grype CVEs</text>
    <text x="14" y="72" fill="#94A3B8" class="font-mono" font-size="10">• Syft SBOM Generation</text>
    <text x="14" y="90" fill="#94A3B8" class="font-mono" font-size="10">• Cosign Keyless Sign</text>
    <rect x="14" y="98" width="152" height="14" rx="3" fill="#221742" />
    <text x="20" y="109" fill="#DDD6FE" class="font-mono" font-size="8.5">SLSA Level 3 Passed</text>
  </g>

  <!-- STEP 4: OCI IMMUTABLE REGISTRY -->
  <g transform="translate(750, 120)">
    <rect width="180" height="120" rx="10" fill="#081e2c" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="24" cy="24" r="6" fill="#3B82F6" />
    <text x="36" y="28" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="700">4. OCI Artifact Vault</text>
    <text x="14" y="54" fill="#94A3B8" class="font-mono" font-size="10">• GitHub GHCR / ECR</text>
    <text x="14" y="72" fill="#94A3B8" class="font-mono" font-size="10">• Helm OCI Packages</text>
    <text x="14" y="90" fill="#94A3B8" class="font-mono" font-size="10">• Immutable SHA256</text>
    <rect x="14" y="98" width="152" height="14" rx="3" fill="#0c2e44" />
    <text x="20" y="109" fill="#93C5FD" class="font-mono" font-size="8.5">ghcr.io/app:sha-8f92a</text>
  </g>

  <!-- STEP 5: ARGOCD GITOPS RECONCILER -->
  <g transform="translate(990, 120)">
    <rect width="180" height="120" rx="10" fill="#081e2c" stroke="#ec4899" stroke-width="1.2" />
    <circle cx="24" cy="24" r="6" fill="#EC4899" />
    <text x="36" y="28" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="700">5. ArgoCD Reconciler</text>
    <text x="14" y="54" fill="#94A3B8" class="font-mono" font-size="10">• Git Source of Truth</text>
    <text x="14" y="72" fill="#94A3B8" class="font-mono" font-size="10">• Auto Sync &amp; Prune</text>
    <text x="14" y="90" fill="#94A3B8" class="font-mono" font-size="10">• Kyverno Pre-Admission</text>
    <rect x="14" y="98" width="152" height="14" rx="3" fill="#2c0c1e" />
    <text x="20" y="109" fill="#F472B6" class="font-mono" font-size="8.5">STATUS: Synced &amp; Healthy</text>
  </g>

  <!-- STEP 6: KUBERNETES TARGET CLUSTER -->
  <g transform="translate(760, 280)">
    <rect width="240" height="120" rx="10" fill="#071824" stroke="#10b981" stroke-width="1.2" />
    <circle cx="24" cy="24" r="6" fill="#10B981" />
    <text x="36" y="28" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="700">6. Kubernetes &amp; Mesh</text>
    <text x="14" y="54" fill="#94A3B8" class="font-mono" font-size="10">• Pod Security Standard (Restricted)</text>
    <text x="14" y="72" fill="#94A3B8" class="font-mono" font-size="10">• Cilium eBPF Network Policies</text>
    <text x="14" y="90" fill="#94A3B8" class="font-mono" font-size="10">• Argo Rollouts (Canary / Blue-Green)</text>
    <rect x="14" y="98" width="212" height="14" rx="3" fill="#0a2a3e" />
    <text x="20" y="109" fill="#6EE7B7" class="font-mono" font-size="8.5">Traffic Shifting: 10% -&gt; 50% -&gt; 100%</text>
  </g>

  <!-- STEP 7: OPENTELEMETRY & TELEMETRY -->
  <g transform="translate(460, 280)">
    <rect width="240" height="120" rx="10" fill="#1b1207" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="24" cy="24" r="6" fill="#F59E0B" />
    <text x="36" y="28" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="700">7. Observability &amp; SRE</text>
    <text x="14" y="54" fill="#94A3B8" class="font-mono" font-size="10">• OTel Collector Agent</text>
    <text x="14" y="72" fill="#94A3B8" class="font-mono" font-size="10">• Prometheus Error Budget Alerts</text>
    <text x="14" y="90" fill="#94A3B8" class="font-mono" font-size="10">• Tempo Distributed Tracing</text>
    <rect x="14" y="98" width="212" height="14" rx="3" fill="#2d1d07" />
    <text x="20" y="109" fill="#FDE68A" class="font-mono" font-size="8.5">SLO Target: 99.99% Availability</text>
  </g>

  <!-- STEP 8: AUTO-HEALING & FEEDBACK -->
  <g transform="translate(220, 280)">
    <rect width="180" height="120" rx="10" fill="#081e2c" stroke="#06b6d4" stroke-width="1.2" />
    <circle cx="24" cy="24" r="6" fill="#06B6D4" />
    <text x="36" y="28" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="700">8. Feedback Loop</text>
    <text x="14" y="54" fill="#94A3B8" class="font-mono" font-size="10">• Auto Rollback on 5xx</text>
    <text x="14" y="72" fill="#94A3B8" class="font-mono" font-size="10">• Infracost Cloud Alert</text>
    <text x="14" y="90" fill="#94A3B8" class="font-mono" font-size="10">• PagerDuty / Slack Alert</text>
    <rect x="14" y="98" width="152" height="14" rx="3" fill="#0c2e44" />
    <text x="20" y="109" fill="#7DD3FC" class="font-mono" font-size="8.5">Self-Healing Triggered</text>
  </g>

  <!-- BOTTOM ACCENT -->
  <g transform="translate(40, 440)">
    <text x="0" y="16" fill="#64748B" class="font-mono" font-size="11">AUTOMATED DRIFT DETECTION: <tspan fill="#10B981">ENABLED</tspan> | CONTINUOUS COMPLIANCE: <tspan fill="#38BDF8">ACTIVE</tspan> | ZERO-TOUCH DEPLOY: <tspan fill="#F59E0B">ENFORCED</tspan></text>
  </g>
</svg>
