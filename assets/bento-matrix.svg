<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b13" />
      <stop offset="100%" stop-color="#02060b" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b29" />
      <stop offset="100%" stop-color="#030d16" />
    </linearGradient>

    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="amberBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <linearGradient id="purpleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <pattern id="cardGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e3a4e" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
    .font-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
    .font-code { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Canvas Container -->
  <rect width="1200" height="700" rx="18" fill="url(#bentoBg)" stroke="#163347" stroke-width="2" />

  <!-- HEADER -->
  <g transform="translate(45, 40)">
    <text x="0" y="0" fill="#00FF9D" class="font-code" font-size="13" font-weight="800" letter-spacing="2">02 // CORE ARCHITECTURAL PILLARS</text>
    <text x="0" y="28" fill="#F8FAFC" class="font-title" font-size="22">Enterprise Platform Engineering &amp; Capabilities Matrix</text>
    <text x="0" y="52" fill="#94A3B8" class="font-body" font-size="14">Foundational capabilities powering resilient, hyper-scale cloud native engineering organizations</text>
  </g>

  <!-- ================= BENTO GRID BOXES ================= -->

  <!-- CARD 1: PLATFORM ENGINEERING (Top-Left, Width: 460, Height: 245) -->
  <g transform="translate(45, 110)">
    <rect width="460" height="245" rx="14" fill="url(#cardGrad1)" stroke="#1e3a4e" stroke-width="1.5" />
    <rect width="460" height="245" rx="14" fill="url(#cardGrid)" />
    <rect x="0" y="0" width="460" height="5" rx="2.5" fill="url(#emeraldBar)" />
    
    <circle cx="38" cy="38" r="15" fill="#062533" stroke="#00FF9D" stroke-width="1.5" />
    <polygon points="38,28 46,42 30,42" fill="#00FF9D" />
    <text x="66" y="34" fill="#FFFFFF" class="font-title" font-size="17">Platform Engineering &amp; IDP</text>
    <text x="66" y="50" fill="#00FF9D" class="font-code" font-size="11" font-weight="700">INTERNAL DEVELOPER PLATFORMS</text>

    <text x="24" y="88" fill="#CBD5E1" class="font-body" font-size="13.5">
      Treating platform as a product. Automated golden paths, self-service portals, and pre-configured templates reducing cognitive load.
    </text>

    <g transform="translate(24, 134)">
      <rect width="130" height="30" rx="7" fill="#0a2333" stroke="#1e3a4e" />
      <text x="12" y="20" fill="#67E8F9" class="font-code" font-size="11" font-weight="700">Spotify Backstage</text>

      <rect x="140" width="135" height="30" rx="7" fill="#0a2333" stroke="#1e3a4e" />
      <text x="152" y="20" fill="#67E8F9" class="font-code" font-size="11" font-weight="700">Ephemeral Envs</text>

      <rect x="285" width="125" height="30" rx="7" fill="#0a2333" stroke="#1e3a4e" />
      <text x="297" y="20" fill="#67E8F9" class="font-code" font-size="11" font-weight="700">Score / Humanitec</text>
    </g>

    <g transform="translate(24, 192)">
      <text x="0" y="16" fill="#94A3B8" class="font-code" font-size="12">Time-to-Production: <tspan fill="#00FF9D" font-weight="800">&lt; 15 mins</tspan> | Dev Autonomy: <tspan fill="#38BDF8" font-weight="800">98%</tspan></text>
      <rect x="0" y="26" width="412" height="7" rx="3.5" fill="#0e2333" />
      <rect x="0" y="26" width="395" height="7" rx="3.5" fill="url(#emeraldBar)" />
    </g>
  </g>

  <!-- CARD 2: DECLARATIVE GITOPS (Top-Center, Width: 340, Height: 245) -->
  <g transform="translate(525, 110)">
    <rect width="340" height="245" rx="14" fill="url(#cardGrad1)" stroke="#1e3a4e" stroke-width="1.5" />
    <rect width="340" height="245" rx="14" fill="url(#cardGrid)" />
    <rect x="0" y="0" width="340" height="5" rx="2.5" fill="url(#emeraldBar)" />

    <circle cx="38" cy="38" r="15" fill="#062533" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="38" cy="38" r="6" fill="#06B6D4" />
    <text x="66" y="34" fill="#FFFFFF" class="font-title" font-size="17">Declarative GitOps</text>
    <text x="66" y="50" fill="#06B6D4" class="font-code" font-size="11" font-weight="700">CONTINUOUS RECONCILIATION</text>

    <text x="24" y="88" fill="#CBD5E1" class="font-body" font-size="13">
      Git repository as the single source of truth for desired cluster state. Automated drift detection and self-healing.
    </text>

    <g transform="translate(24, 134)">
      <rect width="140" height="30" rx="7" fill="#0a2333" stroke="#1e3a4e" />
      <text x="12" y="20" fill="#A7F3D0" class="font-code" font-size="11" font-weight="700">ArgoCD Sync Loop</text>

      <rect x="150" width="140" height="30" rx="7" fill="#0a2333" stroke="#1e3a4e" />
      <text x="162" y="20" fill="#A7F3D0" class="font-code" font-size="11" font-weight="700">Flux v2 Operators</text>
    </g>

    <g transform="translate(24, 192)">
      <text x="0" y="16" fill="#94A3B8" class="font-code" font-size="12">Configuration Drift: <tspan fill="#00FF9D" font-weight="800">0% Tolerance</tspan></text>
      <rect x="0" y="26" width="292" height="7" rx="3.5" fill="#0e2333" />
      <rect x="0" y="26" width="292" height="7" rx="3.5" fill="#06b6d4" />
    </g>
  </g>

  <!-- CARD 3: ZERO-TRUST DEVSECOPS (Top-Right, Width: 275, Height: 245) -->
  <g transform="translate(880, 110)">
    <rect width="275" height="245" rx="14" fill="url(#cardGrad1)" stroke="#1e3a4e" stroke-width="1.5" />
    <rect width="275" height="245" rx="14" fill="url(#cardGrid)" />
    <rect x="0" y="0" width="275" height="5" rx="2.5" fill="url(#purpleBar)" />

    <circle cx="36" cy="38" r="15" fill="#1b1233" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="30" y="32" width="12" height="12" rx="3" fill="#8B5CF6" />
    <text x="62" y="34" fill="#FFFFFF" class="font-title" font-size="16.5">Supply Chain Sec</text>
    <text x="62" y="50" fill="#A78BFA" class="font-code" font-size="10.5" font-weight="700">ZERO-TRUST &amp; SLSA L3</text>

    <text x="20" y="88" fill="#CBD5E1" class="font-body" font-size="13">
      Cryptographic signing, SBOM attestations, and admission policy enforcement.
    </text>

    <g transform="translate(20, 134)">
      <rect width="112" height="30" rx="7" fill="#17102e" stroke="#2d1e57" />
      <text x="10" y="20" fill="#DDD6FE" class="font-code" font-size="10.5" font-weight="700">Kyverno / OPA</text>

      <rect x="122" width="112" height="30" rx="7" fill="#17102e" stroke="#2d1e57" />
      <text x="132" y="20" fill="#DDD6FE" class="font-code" font-size="10.5" font-weight="700">Cosign Keyless</text>
    </g>

    <g transform="translate(20, 192)">
      <text x="0" y="16" fill="#94A3B8" class="font-code" font-size="12">Gate: <tspan fill="#A78BFA" font-weight="800">Pre-Admission Block</tspan></text>
      <rect x="0" y="26" width="235" height="7" rx="3.5" fill="#18122d" />
      <rect x="0" y="26" width="225" height="7" rx="3.5" fill="url(#purpleBar)" />
    </g>
  </g>

  <!-- CARD 4: eBPF OBSERVABILITY (Bottom-Left, Width: 360, Height: 275) -->
  <g transform="translate(45, 375)">
    <rect width="360" height="275" rx="14" fill="url(#cardGrad1)" stroke="#1e3a4e" stroke-width="1.5" />
    <rect width="360" height="275" rx="14" fill="url(#cardGrid)" />
    <rect x="0" y="0" width="360" height="5" rx="2.5" fill="url(#emeraldBar)" />

    <circle cx="38" cy="38" r="15" fill="#062533" stroke="#00FF9D" stroke-width="1.5" />
    <text x="38" y="44" fill="#00FF9D" class="font-code" font-size="14" text-anchor="middle" font-weight="800">λ</text>
    <text x="66" y="34" fill="#FFFFFF" class="font-title" font-size="17">eBPF &amp; Service Mesh</text>
    <text x="66" y="50" fill="#00FF9D" class="font-code" font-size="11" font-weight="700">KERNEL TELEMETRY &amp; MTLS</text>

    <text x="24" y="90" fill="#CBD5E1" class="font-body" font-size="13">
      Kernel-level packet inspection, bypass iptables for line-speed networking, mutual TLS, and granular layer-7 traffic shifting.
    </text>

    <g transform="translate(24, 146)">
      <rect width="98" height="30" rx="7" fill="#0a2333" stroke="#1e3a4e" />
      <text x="10" y="20" fill="#67E8F9" class="font-code" font-size="10.5" font-weight="700">Cilium eBPF</text>

      <rect x="108" width="98" height="30" rx="7" fill="#0a2333" stroke="#1e3a4e" />
      <text x="118" y="20" fill="#67E8F9" class="font-code" font-size="10.5" font-weight="700">Istio Ambient</text>

      <rect x="216" width="95" height="30" rx="7" fill="#0a2333" stroke="#1e3a4e" />
      <text x="226" y="20" fill="#67E8F9" class="font-code" font-size="10.5" font-weight="700">Envoy L7</text>
    </g>

    <g transform="translate(24, 212)">
      <text x="0" y="16" fill="#94A3B8" class="font-code" font-size="12">Latency Overhead: <tspan fill="#00FF9D" font-weight="800">&lt; 0.2ms</tspan></text>
      <rect x="0" y="26" width="312" height="7" rx="3.5" fill="#0e2333" />
      <rect x="0" y="26" width="298" height="7" rx="3.5" fill="url(#emeraldBar)" />
    </g>
  </g>

  <!-- CARD 5: SRE & OPENTELEMETRY (Bottom-Center, Width: 440, Height: 275) -->
  <g transform="translate(425, 375)">
    <rect width="440" height="275" rx="14" fill="url(#cardGrad1)" stroke="#1e3a4e" stroke-width="1.5" />
    <rect width="440" height="275" rx="14" fill="url(#cardGrid)" />
    <rect x="0" y="0" width="440" height="5" rx="2.5" fill="url(#amberBar)" />

    <circle cx="38" cy="38" r="15" fill="#291807" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="38" cy="38" r="5" fill="#F59E0B" />
    <text x="66" y="34" fill="#FFFFFF" class="font-title" font-size="17">SRE, OpenTelemetry &amp; SLOs</text>
    <text x="66" y="50" fill="#F59E0B" class="font-code" font-size="11" font-weight="700">HIGH-CARDINALITY OBSERVABILITY</text>

    <text x="24" y="90" fill="#CBD5E1" class="font-body" font-size="13">
      Vendor-neutral distributed tracing, metrics, and logs via OpenTelemetry Collector. Multi-window error budget burn rate alerting.
    </text>

    <g transform="translate(24, 146)">
      <rect width="120" height="30" rx="7" fill="#1e1307" stroke="#3b2308" />
      <text x="12" y="20" fill="#FDE68A" class="font-code" font-size="10.5" font-weight="700">OTel Collector</text>

      <rect x="130" width="125" height="30" rx="7" fill="#1e1307" stroke="#3b2308" />
      <text x="142" y="20" fill="#FDE68A" class="font-code" font-size="10.5" font-weight="700">Prom / Grafana</text>

      <rect x="265" width="125" height="30" rx="7" fill="#1e1307" stroke="#3b2308" />
      <text x="277" y="20" fill="#FDE68A" class="font-code" font-size="10.5" font-weight="700">Tempo Tracing</text>
    </g>

    <g transform="translate(24, 212)">
      <text x="0" y="16" fill="#94A3B8" class="font-code" font-size="12">MTTD: <tspan fill="#F59E0B" font-weight="800">&lt; 90s</tspan> | MTTR: <tspan fill="#00FF9D" font-weight="800">&lt; 5m</tspan></text>
      <rect x="0" y="26" width="392" height="7" rx="3.5" fill="#1f1408" />
      <rect x="0" y="26" width="380" height="7" rx="3.5" fill="url(#amberBar)" />
    </g>
  </g>

  <!-- CARD 6: CLOUD FINOPS (Bottom-Right, Width: 275, Height: 275) -->
  <g transform="translate(880, 375)">
    <rect width="275" height="275" rx="14" fill="url(#cardGrad1)" stroke="#1e3a4e" stroke-width="1.5" />
    <rect width="275" height="275" rx="14" fill="url(#cardGrid)" />
    <rect x="0" y="0" width="275" height="5" rx="2.5" fill="url(#emeraldBar)" />

    <circle cx="36" cy="38" r="15" fill="#062533" stroke="#00FF9D" stroke-width="1.5" />
    <text x="36" y="44" fill="#00FF9D" class="font-code" font-size="15" text-anchor="middle" font-weight="800">$</text>
    <text x="62" y="34" fill="#FFFFFF" class="font-title" font-size="16.5">FinOps &amp; Cloud</text>
    <text x="62" y="50" fill="#00FF9D" class="font-code" font-size="10.5" font-weight="700">COST GOVERNANCE</text>

    <text x="20" y="90" fill="#CBD5E1" class="font-body" font-size="13">
      Cloud cost attribution, automated CI pull request cost estimations with Infracost, and Karpenter node autoscale.
    </text>

    <g transform="translate(20, 146)">
      <rect width="112" height="30" rx="7" fill="#0a2333" stroke="#1e3a4e" />
      <text x="10" y="20" fill="#6EE7B7" class="font-code" font-size="10.5" font-weight="700">Kubecost Core</text>

      <rect x="122" width="112" height="30" rx="7" fill="#0a2333" stroke="#1e3a4e" />
      <text x="132" y="20" fill="#6EE7B7" class="font-code" font-size="10.5" font-weight="700">Infracost CI</text>
    </g>

    <g transform="translate(20, 212)">
      <text x="0" y="16" fill="#94A3B8" class="font-code" font-size="12">Cloud Waste Cut: <tspan fill="#00FF9D" font-weight="800">~35-45%</tspan></text>
      <rect x="0" y="26" width="235" height="7" rx="3.5" fill="#0e2333" />
      <rect x="0" y="26" width="220" height="7" rx="3.5" fill="url(#emeraldBar)" />
    </g>
  </g>

</svg>