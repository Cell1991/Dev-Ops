<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b13" />
      <stop offset="100%" stop-color="#02060b" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b29" />
      <stop offset="100%" stop-color="#030d16" />
    </linearGradient>

    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="amberBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <linearGradient id="purpleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <pattern id="cardGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e3a4e" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
    .font-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
    .font-code { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Canvas Container -->
  <rect width="1200" height="720" rx="18" fill="url(#bentoBg)" stroke="#163347" stroke-width="2" />

  <!-- HEADER -->
  <g transform="translate(45, 40)">
    <text x="0" y="0" fill="#00FF9D" class="font-code" font-size="13" font-weight="800" letter-spacing="2">02 // CORE ARCHITECTURAL PILLARS</text>
    <text x="0" y="28" fill="#F8FAFC" class="font-title" font-size="22">Enterprise Platform Engineering &amp; Capabilities Matrix</text>
    <text x="0" y="52" fill="#94A3B8" class="font-body" font-size="14">Foundational capabilities powering resilient, hyper-scale cloud native engineering organizations</text>
  </g>

  <!-- ================= BENTO GRID BOXES ================= -->

  <!-- CARD 1: PLATFORM ENGINEERING (Top-Left, Width: 460, Height: 255) -->
  <g transform="translate(45, 110)">
    <rect width="460" height="255" rx="14" fill="url(#cardGrad1)" stroke="#1e3a4e" stroke-width="1.5" />
    <rect width="460" height="255" rx="14" fill="url(#cardGrid)" />
    <rect x="0" y="0" width="460" height="5" rx="2.5" fill="url(#emeraldBar)" />
    
    <circle cx="38" cy="38" r="15" fill="#062533" stroke="#00FF9D" stroke-width="1.5" />
    <polygon points="38,28 46,42 30,42" fill="#00FF9D" />
    <text x="66" y="34" fill="#FFFFFF" class="font-title" font-size="17">Platform Engineering &amp; IDP</text>
    <text x="66" y="50" fill="#00FF9D" class="font-code" font-size="11" font-weight="700">INTERNAL DEVELOPER PLATFORMS</text>

    <!-- Multi-line cleanly wrapped text -->
    <text x="24" y="86" fill="#CBD5E1" class="font-body" font-size="13">
      <tspan x="24" dy="0">Treating the internal platform as a product. Delivers</tspan>
      <tspan x="24" dy="20">automated golden paths and self-service portals.</tspan>
    </text>

    <!-- Sub Features Chips -->
    <g transform="translate(24, 140)">
      <g transform="translate(0, 0)">
        <rect width="130" height="30" rx="7" fill="#0a2333" stroke="#1e3a4e" />
        <text x="12" y="20" fill="#67E8F9" class="font-code" font-size="10.5" font-weight="700">Spotify Backstage</text>
      </g>
      <g transform="translate(138, 0)">
        <rect width="132" height="30" rx="7" fill="#0a2333" stroke="#1e3a4e" />
        <text x="12" y="20" fill="#67E8F9" class="font-code" font-size="10.5" font-weight="700">Ephemeral Envs</text>
      </g>
      <g transform="translate(278, 0)">
