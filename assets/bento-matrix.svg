    <text x="66" y="50" fill="#06B6D4" class="font-code" font-size="11" font-weight="700">CONTINUOUS RECONCILIATION</text>

    <!-- Multi-line cleanly wrapped text -->
    <text x="24" y="86" fill="#CBD5E1" class="font-body" font-size="13">
      <tspan x="24" dy="0">Git as the immutable single source of truth.</tspan>
      <tspan x="24" dy="20">Automated drift detection and self-healing.</tspan>
    </text>

    <g transform="translate(24, 140)">
