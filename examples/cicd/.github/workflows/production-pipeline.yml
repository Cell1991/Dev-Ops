name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  packages: write
  security-events: write

jobs:
  lint-test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - run: go vet ./...
      - run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

  build-and-sign:
    name: Build OCI & Cryptographic Sign
    needs: [lint-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/setup-buildx-action@v3
      
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build & Push OCI Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign & Syft
        uses: sigstore/cosign-installer@v3.5.0

      - uses: anchore/sbom-action/download-syft@v0.16.0

      - name: Generate SBOM
        run: syft packages ghcr.io/${{ github.repository }}:${{ github.sha }} -o spdx-json=sbom.spdx.json

      - name: Sign Container Image (Keyless Sigstore)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.sha }}
          cosign attest --yes --predicate sbom.spdx.json --type spdx ghcr.io/${{ github.repository }}:${{ github.sha }}
