apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-core-api
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: core-api-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic only from the edge Gateway proxy
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: enterprise-gateway
      ports:
        - protocol: TCP
          port: 8080
    # Allow Prometheus monitoring scraper
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow DNS queries to kube-dns
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow outbound connections to PostgreSQL cluster
    - to:
        - podSelector:
            matchLabels:
              app: postgres-db
      ports:
        - protocol: TCP
          port: 5432
